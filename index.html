<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Game Shop</title>

  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #111;
      color: white;
      text-align: center;
    }

    header {
      background: #6c2cff;
      padding: 25px;
    }

    h1 {
      margin: 0;
      font-size: 35px;
    }

    .container {
      padding: 30px;
    }

    .card {
      background: #222;
      padding: 25px;
      margin: 20px auto;
      max-width: 400px;
      border-radius: 15px;
    }

    .price {
      font-size: 25px;
      color: #00ff88;
      font-weight: bold;
    }

    .btn {
      display: inline-block;
      padding: 12px 25px;
      background: #6c2cff;
      color: white;
      text-decoration: none;
      border-radius: 8px;
      margin-top: 10px;
    }

    .btn:hover {
      background: #8b5cff;
    }
  </style>
</head>

<body>

  <header>
    <h1>🎮 GAME SHOP</h1>
    <p>Jeux & Services Gaming</p>
  </header>

  <div class="container">

    <div class="card">
      <h2>🎮 Services Gaming</h2>
      <p>Installation et services pour consoles.</p>
      <p class="price">À partir de 25 DH</p>
      <a class="btn" href="https://www.instagram.com/" target="_blank">
        Nous contacter
      </a>
    </div>

    <div class="card">
      <h2>🕹️ Jeux</h2>
      <p>Découvrez nos jeux et offres disponibles.</p>
      <p class="price">Prix intéressants</p>
    </div>

  </div>

</body>
</html>
